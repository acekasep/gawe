
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Video</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .player {
      width: 100vw;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding-bottom: 20px;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding-bottom: env(safe-area-inset-bottom);
    }

    #message {
      color: #fff;
      font: 16px Arial, sans-serif;
      padding: 24px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="player">
    <video
      id="video"
      controls
      controlsList="nodownload noplaybackrate"
      disablePictureInPicture
      playsinline
      preload="metadata">
    </video>
    <div id="message" hidden>Memuat video...</div>
  </div>

  <script>
    (async () => {
      const video = document.getElementById("video");
      const message = document.getElementById("message");

      function showError(text) {
        video.style.display = "none";
        message.hidden = false;
        message.textContent = text;
      }

      const parts = location.pathname.split("/").filter(Boolean);
      const slug = parts[parts.length - 1];

      if (!slug || slug === "f") {
        showError("Link video tidak valid.");
        return;
      }

      try {
        const response = await fetch(
          `/api/video?slug=${encodeURIComponent(slug)}`
        );

        const result = await response.json();

        if (!response.ok || !result.ok || !result.video) {
          showError(result.error || "Video tidak ditemukan.");
          return;
        }

        const data = result.video;

        document.title = data.title || "Video";

        if (data.thumbnail) {
          video.poster = data.thumbnail;
        }

        video.src = data.video;

        video.addEventListener("error", () => {
          showError("Video gagal dimuat. Silakan coba lagi.");
        });

        let redirected = false;

        video.addEventListener("play", () => {
          if (redirected || !data.affiliate) return;

          redirected = true;

          setTimeout(() => {
            try {
              const affiliateUrl = new URL(data.affiliate);

              if (["http:", "https:"].includes(affiliateUrl.protocol)) {
                location.href = affiliateUrl.href;
              }
            } catch (error) {
              console.error("URL affiliate tidak valid:", error);
            }
          }, 2000);
        });
      } catch (error) {
        console.error(error);
        showError("Terjadi kesalahan saat memuat video.");
      }
    })();
  </script>
</body>
</html>
